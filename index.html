// Keyword classifier used when the user pastes a question (no AI needed).

    const subs = {
        Physics: ["velocity", "force", "acceleration", "current", "voltage", "resistance", "wave", "lens", "mass", "energy", "momentum", "magnetic", "electric", "capacitor", "gravity", "pressure", "temperature", "photon"],
        Chemistry: ["mole", "molar", "ph ", "acid", "base", "reaction", "oxidation", "electron", "bond", "compound", "solution", "equilibrium", "alkane", "benzene", "enthalpy", "atom", "periodic"],
        Mathematics: ["integral", "derivative", "equation", "matrix", "determinant", "probability", "triangle", "circle", "sequence", "log", "sin", "cos", "tan", "limit", "roots", "polynomial", "vector"],
        Biology: ["cell", "dna", "enzyme", "photosynthesis", "species", "organism", "gene", "chromosome", "hormone", "tissue", "ecosystem"]
    };
    let subject = "General", best = 0;
    Object.keys(subs).forEach(k => { const s = score(subs[k]); if (s > best) { best = s; subject = k; } });
    const exam = subject === "Biology" ? "NEET" : (subject === "General" ? "General" : "JEE Main");

}

/* Exam: user-controlled Visual Effects (default OFF). Never moves layout or hides content. */
#dp-fx{display:none}
body.dp-inexam #dp-fx{display:flex;align-items:center;justify-content:center;position:fixed;left:6px;bottom:calc(6px + env(safe-area-inset-bottom));z-index:99990;width:34px;height:34px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(15,23,42,.7);color:#fff;font-size:15px;opacity:.55;cursor:pointer}
body.dp-inexam #dp-fx:hover,body.dp-inexam #dp-fx:focus-visible{opacity:1;outline:2px solid #818cf8}
body.dp-inexam #dp-fx[aria-pressed=true]{opacity:.9;background:linear-gradient(135deg,#6366f1,#ec4899)}
body.dp-inexam:not(.dp-fxon) .dp-exam *,body.dp-inexam:not(.dp-fxon) .dp-exam *::before,body.dp-inexam:not(.dp-fxon) .dp-exam *::after{animation:none!important;transition:none!important}
body.dp-inexam.dp-fxon .dp-exam button,body.dp-inexam.dp-fxon .dp-exam label,body.dp-inexam.dp-fxon .dp-exam [role=button]{transition:background-color .15s,border-color .15s,box-shadow .15s,transform .1s,opacity .15s}
body.dp-inexam.dp-fxon .dp-exam button:not(:disabled):active{transform:scale(.97)}
@media(prefers-reduced-motion:reduce){body.dp-inexam .dp-exam *{animation:none!important;transition:none!important}}
</style>

.dp-tr{position:fixed;z-index:100000;pointer-events:none;width:7px;height:7px;margin:-3px;border-radius:50%;background:radial-gradient(#fff,#a78bfa 50%,transparent 72%);animation:dpTr .7s ease-out forwards}

.dp-main :focus-visible,#dp-snd:focus-visible{outline:2px solid #a5b4fc!important;outline-offset:2px}
body.dp-pause *,body.dp-pause::before,body.dp-pause::after{animation-play-state:paused!important}

</style>
